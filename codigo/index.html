.btn-lang {

color: white;
border: none;
padding: 10px 8px;
font-size: 12px;
font-weight: bold;
border-radius: 6px;
cursor: pointer;
flex: 2;
transition: background 0.2s;
}
.btn-tour.ativo {
background: #c0392b !important;
animation: pulse 1.5s infinite;
}
.btn-localizacao {
background: #2b6cb0;
color: white;
border: none;
padding: 10px 8px;
font-size: 12px;
font-weight: bold;
border-radius: 6px;
cursor: pointer;
flex: 1;
transition: background 0.2s;
}
.btn-3d {
background: #27ae60;
color: white;
border: none;
padding: 10px 8px;
font-size: 12px;
font-weight: bold;
border-radius: 6px;
cursor: pointer;
flex: 1;
transition: background 0.2s;
}
@keyframes pulse {

50% { opacity: 0.6; }
100% { opacity: 1; }

overflow-x: auto;

border-bottom: 1px solid #cbd5e0;
flex-shrink: 0;
-webkit-overflow-scrolling: touch;
}
#filter-bar::-webkit-scrollbar { display: none; }
.btn-filter {

font-size: 11px;
font-weight: 600;
border-radius: 12px;
cursor: pointer;
}
.btn-filter.active {
background: #1a365d;
color: white;
border-color: #1a365d;
}
#status-carregamento {

font-weight: 600;
color: #4a5568;
padding: 6px;
text-align: center;

.popup-img {

border-radius: 6px;
margin-bottom: 6px;

function gerarBotoesFiltro(lista) {
    const c = document.getElementById('filter-bar');
    let h = `<button class="btn-filter ${categoriaAtiva === 'TODAS' ? 'active' : ''}" onclick="filtrarCategoria('TODAS', this)">${TRADUCOES[idiomaAtual].todasCategorias || '🌐 Todas'}</button>`;
    lista.forEach(cat => { h += `<button class="btn-filter ${categoriaAtiva === cat ? 'active' : ''}" onclick="filtrarCategoria('${cat}', this)">${cat}</button>`; });
    c.innerHTML = h;
}

function filtrarCategoria(cat, btn) {
    categoriaAtiva = cat; document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active')); btn.classList.add('active'); plotarPinsNoMapa();
}

window.onload = () => { if (typeof google !== 'undefined') initMap(); else window.initMap = initMap; };
</script>
</body>
</html>
